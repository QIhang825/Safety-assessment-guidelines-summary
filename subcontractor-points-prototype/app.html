function allProjects(){

  subs.forEach(s=>Object.keys(s.projects||{}).forEach(k=>set.add(k)));

  return [...set];
}
function livePeopleList(project){
  return people.filter(p=>{

    return isCompany() || p.project===CURRENT_PROJECT;

function liveSubList(){ return subs.slice(); }
function subProjectRows(project){
  const rows=[];
  liveSubList().forEach(s=>{
    Object.entries(s.projects||{}).forEach(([proj,score])=>{
      if (project && project!=="all" && proj!==project) return;
      if (!isCompany() && proj!==CURRENT_PROJECT) return;
      rows.push({s, project:proj, score});
    });
  });
  return rows;
}

  for(let i=5;i>=0;i--){

    out.push({key:`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`, label:`${x.getMonth()+1}月`});
  }
  return out;
}
function monthVioPeople(key, project){
  const k=(key||today()).slice(0,7);
  return livePeopleList(project).filter(p=>(p.logs||[]).some(l=>(l.t||"").slice(0,7)===k && /扣/.test(l.d)));
}
function monthVioCount(key, project){
  const k=(key||today()).slice(0,7);
  const live=monthVioPeople(k, project).length;
  if (k===monthKeyNow()) return live;
  if (project && project!=="all"){
    const ph=vioHistoryByProject[project];
    return ph && ph[k]!=null ? ph[k] : live;
  }
  const hist=isCompany()?vioHistoryCo:vioHistory;
  return hist[k]!=null ? hist[k] : live;
}

function donutHtml(segs){
  const total=segs.reduce((a,s)=>a+s.value,0);
  const r=42, circ=2*Math.PI*r, cx=60, cy=60;
  let off=0;
  const rings=segs.filter(s=>s.value>0).map(s=>{
    const len=total?(s.value/total)*circ:0;
    const node=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    off+=len;
    return node;
  }).join("");
  return `<div class="donut-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120">
      ${rings || `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E8E8E8" stroke-width="16"></circle>`}
      <circle cx="${cx}" cy="${cy}" r="30" fill="#fff"></circle>
      <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="18" font-weight="700" fill="#333" font-family="Roboto,Arial">${total}</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#999">在场人员</text>
    </svg>
    <div class="donut-legend">${segs.map(s=>`<div class="legend-item"><i class="legend-swatch" style="background:${s.color}"></i><span>${s.label}</span><span class="legend-val">${s.value}</span></div>`).join("")}</div>
  </div>`;
}
function lineHtml(series){
  const w=327, h=168, pl=28, pr=8, pt=18, pb=28;
  const iw=w-pl-pr, ih=h-pt-pb;
  const max=Math.max(4, ...series.map(s=>s.n));
  const step=Math.ceil(max/4)||1;
  const yMax=step*4;
  const xAt=i=>pl+(series.length<=1?iw/2:i*iw/(series.length-1));
  const yAt=v=>pt+ih-(v/yMax)*ih;
  const pts=series.map((s,i)=>`${xAt(i).toFixed(1)},${yAt(s.n).toFixed(1)}`).join(" ");
  const grid=[0,1,2,3,4].map(i=>{
    const y=yAt(i*step);
    return `<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#E8E8E8"/><text x="${pl-4}" y="${y+4}" text-anchor="end" font-size="10" fill="#999">${i*step}</text>`;
  }).join("");
  const labels=series.map((s,i)=>`<text x="${xAt(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="#666">${s.label}</text>`).join("");
  const dots=series.map((s,i)=>`<circle cx="${xAt(i)}" cy="${yAt(s.n)}" r="3.5" fill="#268DFF" stroke="#fff" stroke-width="1.5"/><text x="${xAt(i)}" y="${yAt(s.n)-8}" text-anchor="middle" font-size="11" fill="#333" font-family="Roboto,Arial">${s.n}</text>`).join("");
  return `<svg class="line-chart" viewBox="0 0 ${w} ${h}">${grid}<polyline fill="none" stroke="#268DFF" stroke-width="2" points="${pts}"/>${dots}${labels}</svg>`;
}

function personBLHit(p){
  if (!p) return null;

function plusDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function plusDaysFrom(at, n){
  const d=new Date((at||today())+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function seedNum(s, n){
  let h=0;
  for (const c of String(s)) h=(h*33+c.charCodeAt(0))>>>0;
  return n?h%n:h;
}
function signMark(name){
  return `<svg class="arch-sign" viewBox="0 0 120 36" aria-hidden="true"><text x="6" y="26" font-family="KaiTi,STKaiti,'PingFang SC',serif" font-size="18" fill="#333">${name||""}</text></svg>`;
}
function isSpecialJob(job){ return /焊工|电工|起重|接触网|架子/.test(job||""); }

}

function previewTrainPlus(cid){
  const c=trainConfirms.find(x=>x.id===cid); if(!c) return;
  const p=people.find(x=>x.id===c.pid); if(!p) return;
  const n=Math.max(0, +($("#plusVal")&&$("#plusVal").value)||0);
  const confirmed=c.status==="已确认";
  const prev=confirmed?(+c.plus||0):0;
  const next=+(p.score+(n-prev)).toFixed(1);
  const el=$("#plusPrev");
  if (el) el.textContent=`${confirmed?"调整后":"确认后"}当前分 ${p.score} → ${next}。写入人员积分流水。`;
  const ok=$("#plusOk");
  if (ok && !confirmed) ok.textContent=n>0?`确认加 ${n} 分并复工`:"确认不加分并复工";
}
function submitTrainPlus(cid){
  applyTrainPlus(cid, +($("#plusVal")&&$("#plusVal").value)||0);
}
function applyTrainPlus(cid, plus){
  if (isCompany()){ toast("公司层不能确认加分"); return; }
  const c=trainConfirms.find(x=>x.id===cid); if(!c) return;
  const p=people.find(x=>x.id===c.pid); if(!p) return;
  if ((p.trainCount||0)>=2){ askBL(p.id); return; }
  const n=Math.max(0, +(+plus||0).toFixed(1));
  const was=c.status==="已确认";
  const prev=was?(+c.plus||0):0;
  const delta=+(n-prev).toFixed(1);
  if (delta) p.score=+(p.score+delta).toFixed(1);
  const verb=was?`再次调整加分为 ${n} 分`:(n>0?`确认加分 ${n} 分`:"确认不加分");
  p.logs.unshift({t:today(), d:`停工培训人工${verb}。劳务教育《${c.course}》考试 ${c.exam} 分。`});
  c.status="已确认"; c.plus=n;
  toast(was? p.name+" 加分已调整为 "+n+" 分" : (n>0? p.name+" 已确认加 "+n+" 分" : p.name+" 已确认不加分"));
  render();
}

function monthSnap(){
  const raw=snaps[snapMonth];
  if (!raw) return {subs:[], people:[]};
  const peopleRows=(raw.people||[]).map(row=>{
    const p=people.find(x=>x.name===row.n && (!row.proj || x.project===row.proj));
    return {
      id:p?p.id:"",
      n:row.n, s:row.s, st:row.st,
      job:row.job || (p?p.job:""),
      sub:row.sub || (p?subName(p.sub):""),
      proj:row.proj || (p&&p.project) || CURRENT_PROJECT
    };
  }).filter(p=>isCompany() || p.proj===CURRENT_PROJECT);
  const subRows=(raw.subs||[]).map(s=>{
    const found=subs.find(x=>x.name===s.n);
    return {
      id:found?found.id:"",
      n:s.n, s:s.s, st:s.st,
      extra:found?found.lead:"",
      proj:s.proj||CURRENT_PROJECT,
      projs:found?Object.keys(found.projects||{}):[s.proj||CURRENT_PROJECT]
    };
  });
  return {subs:subRows, people:peopleRows};
}

    if (q && !(p.n+(p.sub||"")+(p.job||"")).includes(q)) return false;
    if (snapJob!=="all" && p.job!==snapJob) return false;
    if (isCompany() && snapProj!=="all" && (p.proj||"")!==snapProj) return false;
    return true;
  });
}
function renderMonth(){
  const company=isCompany();
  const snap=monthSnap();
  const jobs=[...new Set((snap.people||[]).map(p=>p.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh"));
  if (snapJob!=="all" && !jobs.includes(snapJob)) snapJob="all";
  const list=snapTab==="s"?filteredSnapSubs(snap):filteredSnapPeople(snap);
  const empty=snapTab==="s"
    ? (snap.subs.length?"无匹配分包商":"该月无分包商快照")
    : (snap.people.length?"无匹配人员":"该月无人员快照");
  return `<div class="month-pick" onclick="pickMonth()">${snapMonth} 月快照（${25} 日锁定）${ic("chev")}</div>
    <div class="seg"><b class="${snapTab==="s"?"on":""}" onclick="snapTab='s';render()">分包商</b><b class="${snapTab==="p"?"on":""}" onclick="snapTab='p';render()">作业人员</b></div>
    <div class="search-bar">${ic("search")}<input placeholder="${snapTab==="s"?"搜索分包商":"搜索姓名 / 分包商"}" value="${snapQ}" oninput="snapQ=this.value;render()" /></div>
    ${company?`<div class="month-pick" onclick="pickSnapProj()">${projLabel(snapProj)}${ic("chev")}</div>`:""}
    ${snapTab==="p"?`<div class="month-pick" onclick="pickSnapJob()">${snapJob==="all"?"全部工种":snapJob}${ic("chev")}</div>`:""}
    <p class="hint">快照锁定当月累计分，账户不清零。${company?"公司层可按项目筛选全部样本。":""}</p>
    <div class="card" style="margin:0 12px">${
      ((snapTab==="s"
        ? list.map(x=>{
            const projText=(x.projs&&x.projs.length?x.projs.join("、"):x.proj)||"-";
            return `<div class="list-item"${x.id?` onclick="openSub('${x.id}','month')"`:""}><div class="grow"><div class="name">${x.n}</div><div class="sub">${company?projText:CURRENT_PROJECT}</div></div><div class="score ${scoreCls(x.s)}">${x.s}</div>${tagHtml(x.st,x.st==="正常"?"ok":"warn")}${x.id?ic("chev"):""}</div>`;
          }).join("")
        : list.map(x=>{
            const stCls=x.st==="正常"?"ok":x.st.includes("停工")||x.st.includes("黑名单")?"danger":"warn";
            return `<div class="list-item"${x.id?` onclick="openPerson('${x.id}','month')"`:""}><div class="grow"><div class="name">${x.n} · ${x.job||""}</div><div class="sub">${x.sub||""}${company?" · "+(x.proj||""):""}</div></div><div class="score ${scoreCls(x.s)}">${x.s}</div>${tagHtml(x.st,stCls)}${x.id?ic("chev"):""}</div>`;
          }).join(""))
      || `<div class="empty">${empty}</div>`)
    }</div>`;
}
function pickMonth(){
  openSheet(`<div class="box" onclick="event.stopPropagation()"><div class="handle"></div>
    ${Object.keys(snaps).map(k=>`<div class="opt ${snapMonth===k?"on":""}" onclick="snapMonth='${k}';snapQ='';snapJob='all';closeSheet();render()">${k}</div>`).join("")}
    <div class="opt cancel" onclick="closeSheet()">取消</div></div>`);
}
function pickSnapProj(){
  openSheet(`<div class="box" onclick="event.stopPropagation()"><div class="handle"></div>
    <div class="opt ${snapProj==="all"?"on":""}" onclick="snapProj='all';closeSheet();render()">全部项目</div>
    ${allProjects().map(p=>`<div class="opt ${snapProj===p?"on":""}" onclick="snapProj='${p}';closeSheet();render()">${p}</div>`).join("")}
    <div class="opt cancel" onclick="closeSheet()">取消</div></div>`);
}
function pickSnapJob(){
  const jobs=[...new Set((monthSnap().people||[]).map(p=>p.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh"));
  openSheet(`<div class="box" onclick="event.stopPropagation()"><div class="handle"></div>
    <div class="opt ${snapJob==="all"?"on":""}" onclick="snapJob='all';closeSheet();render()">全部工种</div>
    ${jobs.map(j=>`<div class="opt ${snapJob===j?"on":""}" onclick="snapJob='${j}';closeSheet();render()">${j}</div>`).join("")}
    <div class="opt cancel" onclick="closeSheet()">取消</div></div>`);
}

function renderStub(){
  return `<div class="empty">暂无内容</div>`;
}

function render(){
  renderNav();
  const page = stack[stack.length-1];
  const map = {home:renderHome, task:renderStub, shot:renderStub, stats:renderStub, proj:renderStub, dash:renderDash, points:renderPoints, todo:renderTodo, files:renderFiles, person:renderPerson, archive:renderArchive, sub:renderSub, subinfo:renderSubInfo, train:renderTrain, bl:renderBL, blp:renderBLPerson, bls:renderBLSub, month:renderMonth, kpi:renderKpi};
  $("#stage").innerHTML = `<div class="view active">${(map[page]||renderHome)()}</div>`;
  renderActs();
}
render();
</script>
</body>
</html>
